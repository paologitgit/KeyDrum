<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mathematik 1. Sek</title>
  <meta name="description" content="Einführungen und Übungen in drei Stufen zu Themen der 1. Sekundarstufe nach Lehrplan 21.">
  <style>
/* Farben als Variablen; Dunkelmodus folgt der Systemeinstellung. */
:root {
  --bg: #f5f6f8;
  --flaeche: #ffffff;
  --flaeche-2: #eef1f5;
  --text: #1c2230;
  --text-2: #586173;
  --linie: #d9dee6;
  --akzent: #2c5aa8;
  --akzent-text: #ffffff;
  --akzent-hell: #e6edf9;
  --b: #b4531b;
  --gut: #1d7349;
  --gut-hell: #e2f3e9;
  --fehler: #ad2a22;
  --fehler-hell: #fbe8e6;
  --hinweis: #7c5500;
  --hinweis-hell: #fcf2da;
  --radius: 10px;
  --schatten: 0 1px 2px rgba(20, 30, 50, .06), 0 2px 8px rgba(20, 30, 50, .04);
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #13161b;
    --flaeche: #1c2027;
    --flaeche-2: #252a33;
    --text: #e5e8ee;
    --text-2: #a0a8b6;
    --linie: #343b47;
    --akzent: #86aaf0;
    --akzent-text: #0f1a2e;
    --akzent-hell: #212e47;
    --b: #f0a36f;
    --gut: #72cf9d;
    --gut-hell: #19302a;
    --fehler: #f3958d;
    --fehler-hell: #3a2020;
    --hinweis: #e8c26c;
    --hinweis-hell: #342b17;
    --schatten: none;
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 17px;
  line-height: 1.55;
}

.breite {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 16px;
}

a { color: var(--akzent); }

h1 { font-size: 1.75rem; line-height: 1.25; margin: .4em 0 .3em; }
h2 { font-size: 1.2rem; line-height: 1.3; margin: 0 0 .5em; }
h3 { font-size: 1rem; margin: 0 0 .4em; }

.lead { color: var(--text-2); margin-top: 0; }
.klein { font-size: .92rem; color: var(--text-2); }

/* Kopf und Fuss */
.kopf {
  background: var(--flaeche);
  border-bottom: 1px solid var(--linie);
}
.kopf .breite { padding-top: 14px; padding-bottom: 14px; }
.marke { font-weight: 650; text-decoration: none; color: var(--text); letter-spacing: .01em; }

main { padding-top: 12px; padding-bottom: 40px; outline: none; }

.fuss {
  color: var(--text-2);
  font-size: .85rem;
  padding-top: 16px;
  padding-bottom: 32px;
  border-top: 1px solid var(--linie);
}

.pfad { font-size: .9rem; color: var(--text-2); margin-top: 8px; }
.pfad a { color: var(--text-2); }

/* Karten */
.karte {
  background: var(--flaeche);
  border: 1px solid var(--linie);
  border-radius: var(--radius);
  box-shadow: var(--schatten);
  padding: 20px;
  margin: 16px 0;
}

.themen { display: grid; gap: 14px; margin: 20px 0; }
.thema-karte { display: block; margin: 0; text-decoration: none; color: inherit; transition: border-color .15s; }
a.thema-karte:hover { border-color: var(--akzent); }
.thema-karte p { margin: .2em 0 .6em; color: var(--text-2); }
.thema-karte h2 { margin: .35em 0 .2em; }
.gesperrt { opacity: .62; }

.etikett {
  display: inline-block;
  font-size: .78rem;
  font-weight: 600;
  color: var(--akzent);
  background: var(--akzent-hell);
  border-radius: 999px;
  padding: 2px 10px;
}

.pillen { display: flex; flex-wrap: wrap; gap: 6px; }
.pille {
  font-size: .8rem;
  padding: 2px 10px;
  border-radius: 999px;
  border: 1px solid var(--linie);
  color: var(--text-2);
}
.pille.begonnen { border-color: var(--hinweis); color: var(--hinweis); }
.pille.fertig { background: var(--gut-hell); border-color: var(--gut); color: var(--gut); }
.pille.fertig::before { content: "✓ "; }

.status { font-size: .9rem; color: var(--text-2); margin: .3em 0 0; }
.status.fertig { color: var(--gut); font-weight: 600; }
.status.begonnen { color: var(--hinweis); }

/* Stufen */
.stufen { margin: 16px 0; }
.stufe-karte {
  display: flex;
  gap: 16px;
  align-items: center;
  justify-content: space-between;
}
.stufe-karte p { margin: .2em 0; }
.stufe-karte > .knopf { flex-shrink: 0; }
@media (max-width: 560px) {
  .stufe-karte { flex-direction: column; align-items: stretch; }
}

/* Knöpfe */
.knopf {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 8px 18px;
  border-radius: 8px;
  border: 1px solid var(--linie);
  background: var(--flaeche);
  color: var(--text);
  font: inherit;
  font-weight: 550;
  text-decoration: none;
  cursor: pointer;
}
.knopf:hover { border-color: var(--akzent); }
.knopf.primaer { background: var(--akzent); border-color: var(--akzent); color: var(--akzent-text); }
.knopf.primaer:hover { filter: brightness(1.08); }
.knopf.leise { color: var(--text-2); }
.knopf:disabled { opacity: .5; cursor: default; }
.knopf:focus-visible, .option:focus-visible, .link:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid var(--akzent);
  outline-offset: 2px;
}
.knopf-reihe { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

.link {
  background: none;
  border: 0;
  padding: 2px 0;
  font: inherit;
  color: var(--akzent);
  text-decoration: underline;
  cursor: pointer;
  text-align: left;
}

/* Meldungen */
.rm {
  border-radius: 8px;
  padding: 12px 14px;
  margin: 12px 0;
  border-left: 4px solid;
}
.rm.gut { background: var(--gut-hell); border-color: var(--gut); }
.rm.fehler { background: var(--fehler-hell); border-color: var(--fehler); }
.rm.hinweis { background: var(--hinweis-hell); border-color: var(--hinweis); }

/* Einführung */
.inhalt ol { margin: 0; padding-left: 1.4em; }
.abschnitt { scroll-margin-top: 16px; }
.abschnitt ul { padding-left: 1.3em; }
.abschnitt li { margin: .25em 0; }
.begriffe dt { font-weight: 650; margin-top: .5em; }
.begriffe dd { margin: 0 0 0 1em; }
.muster { display: grid; gap: 2px; margin: 10px 0; font-variant-numeric: tabular-nums; }
.muster span { padding: 3px 10px; border-radius: 6px; }
.muster .hervor { background: var(--akzent-hell); font-weight: 600; }
.farbe-b { color: var(--b); font-weight: 650; }
.ende { text-align: center; margin: 28px 0; }

.tabelle { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: .95rem; }
.tabelle th, .tabelle td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--linie); }
.tabelle th { color: var(--text-2); font-weight: 600; }
@media (max-width: 520px) {
  .tabelle { font-size: .85rem; }
  .tabelle th, .tabelle td { padding: 6px 5px; }
}

details.beispiel {
  border: 1px solid var(--linie);
  border-radius: 8px;
  padding: 10px 14px;
  margin: 10px 0;
}
details summary { cursor: pointer; font-weight: 550; }
details[open] summary { margin-bottom: 6px; }

/* Interaktive Elemente */
.widget {
  background: var(--flaeche-2);
  border-radius: 8px;
  padding: 14px;
  margin-top: 14px;
}
.regler-gruppe { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.regler { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .92rem; color: var(--text-2); }
.regler input[type=range] { flex: 1; min-width: 120px; accent-color: var(--akzent); }
.regler output { font-weight: 650; color: var(--text); min-width: 2.5em; font-variant-numeric: tabular-nums; }
.regler select { font: inherit; padding: 6px; border-radius: 6px; border: 1px solid var(--linie); background: var(--flaeche); color: var(--text); }
.widget-text { margin: 6px 0 0; }

/* Terme */
.term {
  font-size: 1.45rem;
  font-weight: 600;
  margin: 10px 0;
  font-variant-numeric: tabular-nums;
  letter-spacing: .01em;
}
.term.gross { font-size: 1.25rem; }
.term.inline { display: inline; font-size: 1.05rem; margin: 0; }
.luecke { color: var(--akzent); }

/* Zahlengerade */
.bild { margin: 8px 0; }
svg.zg { width: 100%; height: auto; display: block; overflow: visible; }
.zg-achse { stroke: var(--text-2); stroke-width: 1.5; }
.zg-spitze-achse { fill: var(--text-2); }
.zg-strich { stroke: var(--text-2); stroke-width: 1; }
.zg-strich.gross { stroke: var(--text); stroke-width: 1.6; }
.zg-zahl { fill: var(--text-2); font-size: 15px; text-anchor: middle; font-family: inherit; }
.zg-punkt { fill: var(--akzent); stroke: var(--flaeche); stroke-width: 2; }
.zg-punkt.b { fill: var(--b); }
.zg-marke { fill: var(--akzent); font-size: 16px; font-weight: 700; text-anchor: middle; font-family: inherit; }
.zg-marke.b { fill: var(--b); }
.zg-pfeil { fill: none; stroke: var(--b); stroke-width: 2.5; }
.zg-spitze { fill: var(--b); }
@media (max-width: 520px) {
  .zg-zahl { font-size: 20px; }
  .zg-marke { font-size: 21px; }
}

/* Übung */
.stand {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  font-size: .92rem;
  color: var(--text-2);
}
.punkte { display: flex; gap: 5px; }
.punkt {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1.5px solid var(--linie);
}
.punkt.gut { background: var(--gut); border-color: var(--gut); }
.punkt.falsch { background: var(--fehler-hell); border-color: var(--fehler); }

.aufgabe .frage p { margin: .3em 0; }
.aufgabe blockquote {
  margin: 12px 0;
  padding: 10px 14px;
  border-left: 4px solid var(--akzent);
  background: var(--akzent-hell);
  border-radius: 0 8px 8px 0;
  font-weight: 550;
}

.eingabe-zeile { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0 4px; }
.zahl-eingabe {
  width: 8.5em;
  min-height: 44px;
  font: inherit;
  font-size: 1.2rem;
  padding: 6px 12px;
  border: 1.5px solid var(--linie);
  border-radius: 8px;
  background: var(--flaeche);
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.vorzeichen { padding: 8px 14px; font-size: 1.1rem; }
.einheit { color: var(--text-2); }

.optionen { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 14px 0 4px; }
.option {
  min-height: 48px;
  padding: 10px 14px;
  font: inherit;
  font-size: 1.1rem;
  font-weight: 550;
  border-radius: 8px;
  border: 1.5px solid var(--linie);
  background: var(--flaeche);
  color: var(--text);
  cursor: pointer;
  white-space: pre;
}
.option:hover:not(:disabled) { border-color: var(--akzent); }
.option:disabled { cursor: default; }
.option.gut { border-color: var(--gut); background: var(--gut-hell); color: var(--gut); opacity: 1; }
.option.falsch { border-color: var(--fehler); background: var(--fehler-hell); color: var(--fehler); }

.loesung { margin-top: 8px; }
.loesung.offen { border-top: 1px solid var(--linie); padding-top: 12px; }
.schritte { padding-left: 1.4em; margin: .4em 0; }
.schritte li { margin: .3em 0; font-variant-numeric: tabular-nums; }
.weiter-zeile { margin-top: 14px; }
</style>

  <!-- Normale Skripte statt ES-Module, damit die Seite auch per Doppelklick (file://) funktioniert. -->
  <script>
/* Allgemeine Hilfsfunktionen: Zufallszahlen, Zahlformat, Zahlengerade als SVG. */
window.MT = window.MT || {};
MT.themen = [];

(function (MT) {
  'use strict';

  /** Ganze Zufallszahl zwischen a und b (beide inklusive). */
  MT.rnd = function (a, b) {
    return a + Math.floor(Math.random() * (b - a + 1));
  };

  /** Wie rnd, aber nie 0. */
  MT.rndNZ = function (a, b) {
    let x;
    do { x = MT.rnd(a, b); } while (x === 0);
    return x;
  };

  MT.pick = function (arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  };

  MT.shuffle = function (arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  /** Zahl mit typografischem Minuszeichen: −7 */
  MT.z = function (n) {
    return n < 0 ? '−' + Math.abs(n) : String(n);
  };

  /** Negative Zahl in Klammern: (−7); positive Zahl ohne Klammern. */
  MT.k = function (n) {
    return n < 0 ? '(−' + Math.abs(n) + ')' : String(n);
  };

  MT.esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  MT.term = function (s) {
    return '<div class="term">' + s + '</div>';
  };

  MT.schritte = function (arr) {
    return '<ol class="schritte">' + arr.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol>';
  };

  /**
   * Zahlengerade als SVG.
   * o.min, o.max        Bereich (ganze Zahlen)
   * o.beschriftung      jede wievielte Zahl beschriftet wird (Standard 5)
   * o.punkte            [{x, text, art:'b'}]  markierte Punkte (art 'b' = zweite Farbe)
   * o.pfeile            [{von, bis}]           Bewegung als Bogenpfeil
   */
  let zaehler = 0;
  MT.zahlengerade = function (o) {
    const min = o.min, max = o.max, beschr = o.beschriftung || 5;
    const punkte = o.punkte || [], pfeile = o.pfeile || [];
    const W = 640, P = 24;
    const y = pfeile.length ? 70 : 24;
    const H = y + (punkte.some(function (p) { return p.text; }) ? 56 : 36);
    const sx = function (x) { return P + (x - min) * (W - 2 * P) / (max - min); };
    const id = 'zg' + (++zaehler);
    const aria = o.aria || ('Zahlengerade von ' + MT.z(min) + ' bis ' + MT.z(max));

    let s = '<svg class="zg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + MT.esc(aria) + '">' +
      '<defs>' +
      '<marker id="' + id + 'a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" class="zg-spitze-achse"/></marker>' +
      '<marker id="' + id + 'p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="zg-spitze"/></marker>' +
      '</defs>';

    s += '<line x1="' + (P - 16) + '" y1="' + y + '" x2="' + (W - 4) + '" y2="' + y + '" class="zg-achse" marker-end="url(#' + id + 'a)"/>';

    for (let x = min; x <= max; x++) {
      const gross = x % beschr === 0;
      const X = sx(x).toFixed(1);
      const l = gross ? 8 : 5;
      s += '<line x1="' + X + '" y1="' + (y - l) + '" x2="' + X + '" y2="' + (y + l) + '" class="zg-strich' + (gross ? ' gross' : '') + '"/>';
      if (gross) s += '<text x="' + X + '" y="' + (y + 26) + '" class="zg-zahl">' + MT.z(x) + '</text>';
    }

    pfeile.forEach(function (p) {
      const x1 = sx(p.von), x2 = sx(p.bis), yy = y - 9;
      const h = Math.min(48, 16 + Math.abs(x2 - x1) * 0.2);
      s += '<path d="M' + x1.toFixed(1) + ',' + yy + ' Q' + ((x1 + x2) / 2).toFixed(1) + ',' + (yy - 2 * h).toFixed(1) + ' ' + x2.toFixed(1) + ',' + yy + '" class="zg-pfeil" marker-end="url(#' + id + 'p)"/>';
    });

    punkte.forEach(function (p) {
      const X = sx(p.x).toFixed(1);
      const kl = p.art === 'b' ? ' b' : '';
      s += '<circle cx="' + X + '" cy="' + y + '" r="6.5" class="zg-punkt' + kl + '"/>';
      if (p.text) s += '<text x="' + X + '" y="' + (y + 48) + '" class="zg-marke' + kl + '">' + MT.esc(p.text) + '</text>';
    });

    return s + '</svg>';
  };
})(window.MT);
</script>
  <script>
/* Lernstand im Browser (localStorage) sowie Export und Import als JSON-Datei. */
(function (MT) {
  'use strict';

  const SCHLUESSEL = 'mathe-tool-fortschritt-v1';
  MT.ZIEL = { anzahl: 10, richtig: 8 }; // 8 der letzten 10 Aufgaben im ersten Versuch richtig

  let daten = null;
  let speicherOk = true;

  function leer() {
    return { version: 1, themen: {} };
  }

  function ganzzahl(v) {
    v = Number(v);
    return Number.isFinite(v) && v >= 0 ? Math.floor(v) : 0;
  }

  /** Übernimmt nur bekannte Felder mit gültigen Werten (wichtig beim Import). */
  function bereinigen(d) {
    const out = leer();
    if (!d || typeof d !== 'object' || !d.themen || typeof d.themen !== 'object') return out;
    Object.keys(d.themen).forEach(function (id) {
      if (!/^[a-z0-9-]{1,40}$/.test(id)) return;
      const t = d.themen[id];
      if (!t || typeof t !== 'object') return;
      const neu = { einfuehrungGelesen: !!t.einfuehrungGelesen, stufen: {} };
      ['1', '2', '3'].forEach(function (n) {
        const s = t.stufen && t.stufen[n];
        if (!s || typeof s !== 'object') return;
        neu.stufen[n] = {
          versuche: ganzzahl(s.versuche),
          richtig: ganzzahl(s.richtig),
          letzte: Array.isArray(s.letzte) ? s.letzte.slice(-MT.ZIEL.anzahl).map(function (v) { return v ? 1 : 0; }) : [],
          abgeschlossen: !!s.abgeschlossen,
          freigeschaltet: !!s.freigeschaltet
        };
      });
      out.themen[id] = neu;
    });
    return out;
  }

  function laden() {
    if (daten) return daten;
    try {
      const roh = window.localStorage.getItem(SCHLUESSEL);
      daten = roh ? bereinigen(JSON.parse(roh)) : leer();
    } catch (e) {
      speicherOk = false;
      daten = leer();
    }
    return daten;
  }

  function sichern() {
    try {
      window.localStorage.setItem(SCHLUESSEL, JSON.stringify(daten));
      speicherOk = true;
    } catch (e) {
      speicherOk = false;
    }
  }

  function thema(id) {
    const d = laden();
    if (!d.themen[id]) d.themen[id] = { einfuehrungGelesen: false, stufen: {} };
    return d.themen[id];
  }

  function stufe(id, n) {
    const t = thema(id);
    if (!t.stufen[n]) t.stufen[n] = { versuche: 0, richtig: 0, letzte: [], abgeschlossen: false, freigeschaltet: false };
    return t.stufen[n];
  }

  MT.speicher = {
    stufe: stufe,

    verfuegbar: function () {
      laden();
      return speicherOk;
    },

    einfuehrungGelesen: function (id) {
      return !!thema(id).einfuehrungGelesen;
    },

    markiereEinfuehrung: function (id) {
      thema(id).einfuehrungGelesen = true;
      sichern();
    },

    stufeOffen: function (id, n) {
      if (n === 1) return true;
      return stufe(id, n - 1).abgeschlossen || stufe(id, n).freigeschaltet;
    },

    freischalten: function (id, n) {
      stufe(id, n).freigeschaltet = true;
      sichern();
    },

    /** Erfasst ein Ergebnis. Gibt true zurück, wenn die Stufe dadurch neu abgeschlossen wurde. */
    erfassen: function (id, n, richtig) {
      const s = stufe(id, n);
      s.versuche++;
      if (richtig) s.richtig++;
      s.letzte.push(richtig ? 1 : 0);
      if (s.letzte.length > MT.ZIEL.anzahl) s.letzte.shift();
      let neu = false;

  /** Liest eine ganze Zahl; akzeptiert auch −, –, Leerzeichen und Klammern. Gibt null bei ungültiger Eingabe. */
  function leseZahl(s) {
    s = String(s).trim().replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/^\((.*)\)$/, '$1').replace(/^\+/, '');
    if (!/^-?\d{1,7}$/.test(s)) return null;
    const n = parseInt(s, 10);
    return n === 0 ? 0 : n; // −0 vermeiden
  }

  function zeigeUebung(t, n) {
    const cfg = t.stufen[n];
    app.innerHTML =
      pfad(['<a href="#/">Übersicht</a>', '<a href="#/thema/' + t.id + '">' + esc(t.titel) + '</a>', 'Stufe ' + n]) +
      '<h1>Stufe ' + n + ': ' + esc(cfg.titel) + '</h1>' +
      '<p class="lead">' + esc(cfg.beschreibung) + '</p>' +
      '<div class="stand" id="stand"></div>' +
      '<div id="meldung" aria-live="polite"></div>' +
      '<section class="karte aufgabe" id="aufgabe"></section>';

    const standEl = document.getElementById('stand');
    const meldungEl = document.getElementById('meldung');
    const box = document.getElementById('aufgabe');
    let letzter = -1;

    function zeichneStand() {
      const s = MT.speicher.stufe(t.id, n);
      const summe = s.letzte.reduce(function (a, b) { return a + b; }, 0);
      let punkte = '';
      for (let i = 0; i < MT.ZIEL.anzahl; i++) {
        const v = s.letzte[i];
        punkte += '<span class="punkt' + (v === 1 ? ' gut' : v === 0 ? ' falsch' : '') + '"></span>';
      }
      standEl.innerHTML =
        '<div class="punkte" role="img" aria-label="' + summe + ' von ' + s.letzte.length + ' der letzten Aufgaben richtig">' + punkte + '</div>' +
        '<div class="stand-text">' +
        (s.abgeschlossen
          ? '<strong>Stufe abgeschlossen.</strong> Sie können hier weiter üben.'
          : 'Letzte ' + MT.ZIEL.anzahl + ' Aufgaben: ' + summe + ' im ersten Versuch richtig. Ziel: ' + MT.ZIEL.richtig + '.') +
        '</div>';
    }

    function neueAufgabe() {
      const g = cfg.generatoren;
      let i;
      do { i = Math.floor(Math.random() * g.length); } while (g.length > 1 && g[i] === g[letzter]);
      letzter = i;
      zeigeAufgabe(g[i]());
    }

    function zeigeAufgabe(a) {
      const maxVersuche = a.typ === 'auswahl' && a.optionen.length <= 2 ? 1 : 2;
      let versuch = 1, fertig = false;

      let eingabe;
      if (a.typ === 'zahl') {
        eingabe =
          '<form class="eingabe-zeile" novalidate autocomplete="off">' +
          '<button type="button" class="knopf vorzeichen" title="Vorzeichen wechseln" aria-label="Vorzeichen wechseln">±</button>' +
          '<input type="text" inputmode="numeric" class="zahl-eingabe" aria-label="Ihre Antwort" spellcheck="false">' +
          (a.einheit ? '<span class="einheit">' + esc(a.einheit) + '</span>' : '') +
          '<button type="submit" class="knopf primaer">Prüfen</button></form>';
      } else {
        eingabe = '<div class="optionen">' + a.optionen.map(function (o) {
          return '<button type="button" class="option" data-wert="' + esc(o.wert) + '">' + esc(o.text) + '</button>';
        }).join('') + '</div>';
      }

      box.innerHTML =
        '<div class="frage">' + a.frage + '</div>' +
        (a.bild ? '<div class="bild">' + a.bild + '</div>' : '') +
        eingabe +
        '<div class="rueckmeldung" aria-live="polite"></div>' +
        '<div class="weiter-zeile" hidden><button type="button" class="knopf primaer weiter">Nächste Aufgabe</button></div>';

      const rm = box.querySelector('.rueckmeldung');
      const weiter = box.querySelector('.weiter');
      const feld = box.querySelector('.zahl-eingabe');

      function antwortText() {
        if (a.typ === 'zahl') return z(a.antwort) + (a.einheit ? ' ' + esc(a.einheit) : '');
        const o = a.optionen.find(function (o) { return o.wert === a.antwort; });
        return esc(o ? o.text : a.antwort);
      }

      function abschliessen(richtigImErsten) {
        fertig = true;
        const neu = MT.speicher.erfassen(t.id, n, richtigImErsten);
        box.querySelectorAll('input, form button, .option').forEach(function (e) {
          e.disabled = true;
          if (e.getAttribute('data-wert') === a.antwort) e.classList.add('gut');
        });
        box.querySelector('.weiter-zeile').hidden = false;
        weiter.focus({ preventScroll: true });
        zeichneStand();
        if (neu) {
          meldungEl.innerHTML = n < 3
            ? '<div class="rm gut"><strong>Sie haben Stufe ' + n + ' abgeschlossen.</strong> Stufe ' + (n + 1) + ' ist jetzt freigeschaltet. <a href="#/thema/' + t.id + '/stufe/' + (n + 1) + '">Zu Stufe ' + (n + 1) + '</a></div>'
            : '<div class="rm gut"><strong>Sie haben alle drei Stufen dieses Themas abgeschlossen.</strong> Sie können hier weiter üben oder <a href="#/">zur Übersicht</a> zurückkehren.</div>';
        }
      }

      function pruefe(wert) {
        if (fertig) return;
        const richtig = wert === a.antwort;
        if (richtig) {
          rm.innerHTML =
            '<div class="rm gut"><strong>Richtig.</strong>' + (versuch > 1 ? ' Im zweiten Versuch gelöst.' : '') + '</div>' +
            '<details class="loesung"><summary>Lösungsweg ansehen</summary>' + a.loesung + '</details>';
          abschliessen(versuch === 1);
        } else if (versuch < maxVersuche) {
          versuch++;
          rm.innerHTML = '<div class="rm hinweis"><strong>Noch nicht richtig.</strong> ' + a.hinweis + ' Versuchen Sie es noch einmal.</div>';
          if (feld) { feld.select(); feld.focus(); }
        } else {
          rm.innerHTML =
            '<div class="rm fehler"><strong>Leider nicht richtig.</strong> Die richtige Antwort lautet: <strong>' + antwortText() + '</strong></div>' +
            '<div class="loesung offen"><h3>Lösungsweg</h3>' + a.loesung + '</div>';
          abschliessen(false);
        }
      }

      if (a.typ === 'zahl') {
        box.querySelector('form').addEventListener('submit', function (e) {
          e.preventDefault();
          const w = leseZahl(feld.value);
          if (w === null) {
            rm.innerHTML = '<div class="rm hinweis">Bitte geben Sie eine ganze Zahl ein, zum Beispiel −12.</div>';
            feld.focus();
            return;
          }
          pruefe(w);
        });
        box.querySelector('.vorzeichen').addEventListener('click', function () {
          const v = feld.value.trim();
          feld.value = /^[-−–]/.test(v) ? v.replace(/^[-−–]\s*/, '') : '−' + v;
          feld.focus();
        });
        feld.focus({ preventScroll: true });
      } else {
        box.querySelectorAll('.option').forEach(function (b) {
          b.addEventListener('click', function () {
            const w = b.getAttribute('data-wert');
            if (w === a.antwort) b.classList.add('gut');
            else { b.classList.add('falsch'); b.disabled = true; }
            pruefe(w);
          });
        });
      }

      weiter.addEventListener('click', function () {
        meldungEl.innerHTML = '';
        neueAufgabe();
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    }

    zeichneStand();
    neueAufgabe();
  }

  window.addEventListener('hashchange', route);
  route();
})(window.MT);
</script>
</body>
</html>
