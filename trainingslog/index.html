function downloadCsv(rows) {
  const cell = v => { const s = v == null ? '' : String(v); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  // Semikolon und BOM: öffnet sich in Excel (deutschsprachig) direkt richtig
  const csv = '﻿' + rows.map(r => r.map(cell).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `trainingslog-${today()}.csv`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(`${rows.length - 1} Zeilen exportiert`);
}

// ---------- Ansicht: Verlauf einer Übung ----------
async function showHistory(exId) {
  let hist, all;
  try { [hist, all] = await Promise.all([store.history(exId), store.exercises(true)]); } catch (e) { return showPageError(e); }
  const ex = all.find(e => e.id === exId);
  setHeader(ex ? ex.name : 'Verlauf', true);
  if (!hist.length) { app.innerHTML = '<div class="card empty">Für diese Übung sind noch keine Sätze erfasst.</div>'; return; }

  // Pro Training: Höchstgewicht bzw. längste Zeit; Bestwert = besser als alle früheren Trainings
  const mode = ex?.mode || 'weight';
  let runningBest = -Infinity;
  const points = hist.map(h => {
    const max = bestOf(mode, h.sets);
    const pr = max > runningBest && runningBest !== -Infinity;
    runningBest = Math.max(runningBest, max);
    return { ...h, max, pr };
  }).filter(p => p.max !== -Infinity);   // Sätze der anderen Erfassungsart haben keinen Wert
  const best = runningBest;
  if (!points.length) { app.innerHTML = '<div class="card empty">Für diese Übung sind noch keine passenden Sätze erfasst.</div>'; return; }

  // Ausdauer: Gesamtstrecke und Durchschnittstempo pro Einheit
  const cardio = mode === 'cardio';
  const totalKm = cardio ? points.reduce((s, p) => s + p.sets.reduce((t, x) => t + (x.distance || 0), 0), 0) : 0;
  const speedPts = cardio ? points.map(p => {
    const km = p.sets.reduce((t, x) => t + (x.distance || 0), 0), sec = p.sets.reduce((t, x) => t + (x.duration || 0), 0);
    return km && sec ? { date: p.date, max: km / (sec / 3600), km, sec } : null;
  }).filter(Boolean) : [];
  const runner = speedPts.length && speedPts.reduce((s, p) => s + p.max, 0) / speedPts.length < 15;   // Pace statt km/h
  app.innerHTML = `
    <div class="stats ${cardio ? 'stats3' : ''}">
      <div class="card stat"><div class="v">${fmtMetric(mode, best)}</div><div class="l">${cardio ? 'Längste Strecke' : 'Bestwert'}</div></div>
      <div class="card stat"><div class="v">${points.length}</div><div class="l">${cardio ? 'Einheiten' : 'Trainings'}</div></div>
      ${cardio ? `<div class="card stat"><div class="v">${totalKm >= 1000 ? fmtInt(totalKm) : fmtW(Math.round(totalKm * 10) / 10)}</div><div class="l">km gesamt</div></div>` : ''}
    </div>
    <div class="card chart-card">
      <h3>${{ time: 'Längste Zeit pro Training', cardio: 'Distanz pro Einheit (km)' }[mode] || 'Höchstgewicht pro Training (kg)'}</h3>
      <div id="chart"></div>
      <div class="tip" id="tip"></div>
    </div>
    ${speedPts.length ? `<div class="card chart-card"><h3>${runner ? 'Pace pro Einheit (min/km)' : 'Ø Geschwindigkeit (km/h)'}</h3><div id="chart2"></div><div class="tip" id="tip2"></div></div>` : ''}
    <h2>Alle Trainings</h2>
    <div class="card">
      ${points.slice().reverse().map(p => `
        <div class="list-item" data-w="${p.workout_id}">
          <div class="grow">
            <div class="date">${fmtDate(p.date)} ${p.pr ? '<span class="badge pr">★ Bestwert</span>' : ''}</div>
            <div class="muted">${esc(summarize(p.sets))}</div>
          </div>
          <span class="muted">›</span>
        </div>`).join('')}
    </div>`;
  app.querySelectorAll('[data-w]').forEach(el => el.onclick = () => go(`#w${el.dataset.w}`));
  if (speedPts.length) {
    drawChart($('#chart2'), $('#tip2'), runner ? speedPts.map(p => ({ ...p, max: Math.round(p.sec / p.km) })) : speedPts, runner
      ? { fmt: v => `${Math.floor(v / 60)}:${String(Math.round(v % 60)).padStart(2, '0')} /km`, axisFmt: v => `${Math.floor(v / 60)}:${String(Math.round(v % 60)).padStart(2, '0')}`, steps: [5, 10, 15, 30, 60, 120], extra: p => `${fmtW(p.km)} km`, label: 'Pace pro Einheit' }
      : { fmt: v => `${fmtW(Math.round(v * 10) / 10)} km/h`, axisFmt: v => fmtW(v), steps: [0.5, 1, 2, 5, 10], extra: p => `${fmtW(p.km)} km`, label: 'Geschwindigkeit pro Einheit' });
  }
  drawChart($('#chart'), $('#tip'), points, mode === 'cardio'
    ? { fmt: v => `${fmtW(v)} km`, axisFmt: fmtW, steps: [0.5, 1, 2, 5, 10, 20, 25, 50, 100], extra: p => p.sets.length > 1 ? `${p.sets.length} Einträge` : (p.sets[0].duration ? fmtDur(p.sets[0].duration) : ''), label: 'Distanz pro Einheit' }
    : mode === 'time'
    ? { fmt: v => fmtDur(v), axisFmt: v => `${Math.floor(v / 60)}:${String(Math.round(v % 60)).padStart(2, '0')}`, steps: [5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600], extra: p => `${p.sets.length} Sätze`, label: 'Längste Zeit pro Training' }
    : { fmt: v => `${fmtW(v)} kg`, axisFmt: fmtW, steps: [1, 2, 2.5, 5, 10, 20, 25, 50, 100], extra: p => `${p.sets.length} Sätze`, label: 'Höchstgewicht pro Training' });
}

// Linien-Diagramm: ein Wert pro Datum (points: {date, max, pr?})
function drawChart(host, tip, points, opts) {
  const { fmt, axisFmt, steps, extra, range, label } = opts;
  const W = Math.max(host.clientWidth, 280), H = 200;
  const m = { t: 12, r: 16, b: 26, l: 44 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = points.map(p => p.max);
  let lo, hi, step;
  if (range) {
    [lo, hi] = range; step = steps.find(s => (hi - lo) / s <= 5) || steps[steps.length - 1];
  } else {
    lo = Math.min(...vals); hi = Math.max(...vals);
    const span = hi - lo || Math.max(hi * 0.2, steps[0] * 2);
    step = steps.find(s => span / s <= 4) || steps[steps.length - 1];
    lo = Math.max(0, Math.floor((lo - span * 0.1) / step) * step);
    hi = Math.ceil((hi + span * 0.1) / step) * step;
    if (hi === lo) hi = lo + step;
  }
  const x = i => m.l + (points.length === 1 ? iw / 2 : (i / (points.length - 1)) * iw);
  const y = v => m.t + ih - ((v - lo) / (hi - lo)) * ih;

  const ticks = [];
  for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(Math.round(v * 1000) / 1000);
  const grid = ticks.map(v => `
    <line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
    <text class="axis" x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${axisFmt(v)}</text>`).join('');
  const xLabels = (points.length === 1 ? [0] : [0, points.length - 1]).map(i => `
    <text class="axis" x="${x(i)}" y="${H - 6}" text-anchor="${points.length === 1 ? 'middle' : i === 0 ? 'start' : 'end'}">${fmtShort(points[i].date)}</text>`).join('');
  const path = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.max).toFixed(1)}`).join('');
  const dots = points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.max)}" r="${p.pr ? 5 : 4}" fill="${p.pr ? 'var(--pr-text)' : 'var(--accent)'}" stroke="var(--card)" stroke-width="2"/>`).join('');

  host.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
      ${grid}${xLabels}
      <line class="cross" y1="${m.t}" y2="${m.t + ih}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
    </svg>`;
  const svg = $('svg', host), cross = $('.cross', host);
  const show = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    let best = 0;
    points.forEach((p, i) => { if (Math.abs(x(i) - px) < Math.abs(x(best) - px)) best = i; });
    const p = points[best];
    cross.setAttribute('x1', x(best)); cross.setAttribute('x2', x(best)); cross.setAttribute('visibility', 'visible');
    tip.innerHTML = `${fmtDate(p.date)}<br><strong>${fmt(p.max)}</strong>${p.pr ? ' ★' : ''}${extra ? ` · ${extra(p)}` : ''}`;
    placeTip(tip, svg, x(best) * (r.width / W), y(p.max) * (r.height / H));
  };
  bindTip(svg, tip, show, () => cross.setAttribute('visibility', 'hidden'));
}

// Säulen-Diagramm (items: {label, value, tip}), Achse beginnt bei 0
function drawBars(host, tip, items, { axisFmt, steps }) {
  const W = Math.max(host.clientWidth, 280), H = 170;
  const m = { t: 10, r: 10, b: 24, l: 44 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = Math.max(...items.map(i => i.value), 0);
  const step = steps.find(s => (max || 1) / s <= 4) || steps[steps.length - 1];
  const hi = Math.max(step, Math.ceil(max / step) * step);
  const slot = iw / items.length, bw = Math.max(4, slot - 4);   // 4px Abstand zwischen den Säulen
  const y = v => m.t + ih - (v / hi) * ih;
  const ticks = [];
  for (let v = 0; v <= hi + 1e-9; v += step) ticks.push(v);
  const grid = ticks.map(v => `
    <line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
    <text class="axis" x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${axisFmt(v)}</text>`).join('');
  const bars = items.map((it, i) => it.value > 0
    ? `<rect class="bar" data-i="${i}" x="${(m.l + i * slot + 2).toFixed(1)}" y="${y(it.value).toFixed(1)}" width="${bw.toFixed(1)}" height="${(m.t + ih - y(it.value)).toFixed(1)}" fill="var(--accent)"/>` : '').join('');
  // Nur jede dritte Wochenbeschriftung, damit nichts überlappt
  const labels = items.map((it, i) => (items.length - 1 - i) % 3 === 0
    ? `<text class="axis" x="${(m.l + i * slot + slot / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${it.label}</text>` : '').join('');
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}<line x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1"/>${bars}${labels}</svg>`;
  const svg = $('svg', host);
  const show = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    const i = Math.min(items.length - 1, Math.max(0, Math.floor((px - m.l) / slot)));
    svg.querySelectorAll('.bar').forEach(b => b.setAttribute('opacity', Number(b.dataset.i) === i ? 1 : 0.45));
    tip.innerHTML = items[i].tip;
    placeTip(tip, svg, (m.l + i * slot + slot / 2) * (r.width / W), y(items[i].value) * (r.height / H));
  };
  bindTip(svg, tip, show, () => svg.querySelectorAll('.bar').forEach(b => b.setAttribute('opacity', 1)));
}

function placeTip(tip, svg, sx, sy) {
  const host = svg.parentElement, offX = host.offsetLeft, offY = host.offsetTop, w = svg.getBoundingClientRect().width;
  tip.style.display = 'block';
  tip.style.left = offX + Math.min(Math.max(sx, 70), w - 70) + 'px';
  tip.style.top = offY + Math.max(sy - 8, 34) + 'px';
}
function bindTip(svg, tip, show, reset) {
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; reset(); });
}

// ---------- Offline-Fähigkeit: App-Dateien zwischenspeichern ----------
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ---------- Start ----------
(async () => {
  const r = await pickStore();
  if (r?.auth) return showLogin(r);
  if (r instanceof Error) return showPageError(r);
  route();
})();
</script>
