<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Machine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f1a;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 0.3em;
            margin-bottom: 10px;
            color: #e0e0e0;
            text-transform: uppercase;
        }

        canvas {
            display: block;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }

        .bpm-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bpm-control button {
            width: 44px;
            height: 44px;
            border: 2px solid #444;
            background: #1a1a2e;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            line-height: 1;
        }

        .bpm-control button:hover {
            border-color: #888;
            background: #2a2a4e;
        }

        .bpm-control button:active {
            transform: scale(0.92);
        }

        .bpm-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bpm-display {
            font-size: 2.8rem;
            font-weight: bold;
            min-width: 110px;
            text-align: center;
            color: #fff;
            line-height: 1;
        }

        .bpm-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.25em;
        }

        #startStop {
            padding: 12px 44px;
            font-size: 1.1rem;
            border: 2px solid #4CAF50;
            background: transparent;
            color: #4CAF50;
            cursor: pointer;
            border-radius: 25px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: all 0.15s;
            margin-top: 16px;
        }

        #startStop:hover {
            background: #4CAF50;
            color: #fff;
        }

        #startStop:active {
            transform: scale(0.96);
        }

        #startStop.playing {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        #startStop.playing:hover {
            background: #e74c3c;
            color: #fff;
        }

        .legend {
            display: flex;
            gap: 24px;
            margin-top: 14px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .hint {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #444;
        }

        .loading {
            color: #888;
            font-size: 1.2rem;
            margin-top: 40px;
        }

        .error {
            color: #e74c3c;
            font-size: 0.95rem;
            margin-top: 20px;
            text-align: center;
            max-width: 400px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>Drum Machine</h1>
    <div id="loading" class="loading">Sounds werden geladen...</div>
    <div id="error" class="error" style="display:none;"></div>

    <canvas id="canvas" width="400" height="400" style="display:none;"></canvas>

    <div id="ui" style="display:none;">
        <div class="controls">
            <div class="bpm-control">
                <button id="bpmDown" title="BPM verringern">&#8722;</button>
                <div class="bpm-wrapper">
                    <div class="bpm-display" id="bpmDisplay">120</div>
                    <div class="bpm-label">BPM</div>
                </div>
                <button id="bpmUp" title="BPM erhoehen">+</button>
            </div>
        </div>

        <div style="display:flex; flex-direction:column; align-items:center;">
            <button id="startStop">Start</button>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot" style="background:#e74c3c;"></div>
                    <span>Bass</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background:#f39c12;"></div>
                    <span>Snare</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background:#3498db;"></div>
                    <span>Hi-Hat</span>
                </div>
            </div>

            <div class="hint">Leertaste = Start / Stop &nbsp;&bull;&nbsp; Pfeiltasten = BPM</div>
        </div>
    </div>

    <script>
        // =========================================================
        //  AUDIO
        // =========================================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        let bassBuffer = null;
        let snareBuffer = null;
        let hatBuffer  = null;

        async function loadSample(url) {
            const resp = await fetch(url);
            const buf  = await resp.arrayBuffer();
            return audioCtx.decodeAudioData(buf);
        }

        async function loadAllSamples() {
            try {
                [bassBuffer, snareBuffer, hatBuffer] = await Promise.all([
                    loadSample('basedrum.wav'),
                    loadSample('snare.wav'),
                    loadSample('hat.wav'),
                ]);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('canvas').style.display  = 'block';
                document.getElementById('ui').style.display       = 'block';
            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display   = 'block';
                document.getElementById('error').innerHTML =
                    'Fehler beim Laden der Sounds.<br>' +
                    'Starte einen lokalen Server im Ordner:<br><br>' +
                    '<code style="background:#1a1a2e;padding:6px 12px;border-radius:4px;">' +
                    'python -m http.server 8000</code><br><br>' +
                    'Dann oeffne <code>http://localhost:8000/DrumMachine.html</code>';
            }
        }

        function playSample(buffer, time, volume) {
            const source = audioCtx.createBufferSource();
            const gain   = audioCtx.createGain();
            gain.gain.value = volume;
            source.buffer = buffer;
            source.connect(gain);
            gain.connect(audioCtx.destination);
            source.start(time);
        }

        // =========================================================
        //  PATTERN  –  8 eighth-note steps in 4/4
        // =========================================================
        //  [bass, snare, hihat]
        const pattern = [
            [true,  false, true],   // 1   Bass + HiHat
            [false, false, true],   // &   HiHat
            [false, true,  true],   // 2   Snare + HiHat
            [false, false, true],   // &   HiHat
            [true,  false, true],   // 3   Bass + HiHat
            [false, false, true],   // &   HiHat
            [false, true,  true],   // 4   Snare + HiHat
            [false, false, true],   // &   HiHat
        ];

        const stepLabels = ['1', '&', '2', '&', '3', '&', '4', '&'];

        // =========================================================
        //  STATE
        // =========================================================
        let bpm         = 120;
        let isPlaying   = false;
        let currentStep = 0;
        let nextNoteTime = 0;
        let timerID     = null;
        let displayStep = -1;

        // Queue for syncing visuals to audio
        const scheduleQueue = [];

        // =========================================================
        //  SCHEDULER  (lookahead pattern)
        // =========================================================
        const LOOKAHEAD   = 0.1;   // seconds to look ahead
        const INTERVAL_MS = 25;    // scheduler tick

        function scheduleNote(step, time) {
            const [bass, snare, hat] = pattern[step];
            if (bass)  playSample(bassBuffer,  time, 0.7);
            if (snare) playSample(snareBuffer, time, 0.6);
            if (hat)   playSample(hatBuffer,   time, 0.35);

            scheduleQueue.push({ step, time });
            // Keep the queue small
            while (scheduleQueue.length > 24) scheduleQueue.shift();
        }

        function advanceNote() {
            const eighthNote = 60.0 / bpm / 2;
            nextNoteTime += eighthNote;
            currentStep = (currentStep + 1) % 8;
        }

        function scheduler() {
            while (nextNoteTime < audioCtx.currentTime + LOOKAHEAD) {
                scheduleNote(currentStep, nextNoteTime);
                advanceNote();
            }
        }

        // =========================================================
        //  PLAYBACK CONTROLS
        // =========================================================
        function startPlayback() {
            if (isPlaying) return;
            audioCtx.resume();
            isPlaying    = true;
            currentStep  = 0;
            nextNoteTime = audioCtx.currentTime;
            scheduleQueue.length = 0;

            scheduler();
            timerID = setInterval(scheduler, INTERVAL_MS);

            const btn = document.getElementById('startStop');
            btn.textContent = 'Stop';
            btn.classList.add('playing');
        }

        function stopPlayback() {
            if (!isPlaying) return;
            isPlaying = false;
            clearInterval(timerID);
            displayStep = -1;
            scheduleQueue.length = 0;

            const btn = document.getElementById('startStop');
            btn.textContent = 'Start';
            btn.classList.remove('playing');
        }

        function togglePlayback() {
            isPlaying ? stopPlayback() : startPlayback();
        }

        // =========================================================
        //  CANVAS DRAWING
        // =========================================================
        const canvas  = document.getElementById('canvas');
        const ctx     = canvas.getContext('2d');
        const CX      = canvas.width  / 2;
        const CY      = canvas.height / 2;
        const RADIUS  = 150;
        const DOT_R   = 18;
        const DOT_R_A = 26;   // active dot radius

        const COLORS = {
            bass:     '#e74c3c',
            snare:    '#f39c12',
            hat:      '#3498db',
            bassDim:  'rgba(231,  76,  60, 0.25)',
            snareDim: 'rgba(243, 156,  18, 0.25)',
            hatDim:   'rgba( 52, 152, 219, 0.25)',
        };

        function stepColor(step, active) {
            const [bass, snare] = pattern[step];
            if (bass)  return active ? COLORS.bass  : COLORS.bassDim;
            if (snare) return active ? COLORS.snare : COLORS.snareDim;
            return active ? COLORS.hat : COLORS.hatDim;
        }

        function stepAngle(step) {
            // Start at 12-o'clock (-PI/2), go clockwise
            return (step / 8) * Math.PI * 2 - Math.PI / 2;
        }

        function draw() {
            // --- Sync display step from queue ---
            const now = audioCtx.currentTime;
            while (scheduleQueue.length > 1 && now >= scheduleQueue[1].time) {
                scheduleQueue.shift();
            }
            if (scheduleQueue.length > 0 && now >= scheduleQueue[0].time) {
                displayStep = scheduleQueue[0].step;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- Circle outline ---
            ctx.beginPath();
            ctx.arc(CX, CY, RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // --- Clock hand to active dot ---
            if (isPlaying && displayStep >= 0) {
                const a  = stepAngle(displayStep);
                const dx = CX + Math.cos(a) * RADIUS;
                const dy = CY + Math.sin(a) * RADIUS;

                ctx.beginPath();
                ctx.moveTo(CX, CY);
                ctx.lineTo(dx, dy);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // --- Beat number in center ---
            if (isPlaying && displayStep >= 0) {
                const beatNum = Math.floor(displayStep / 2) + 1;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.font      = 'bold 90px Segoe UI, Arial, sans-serif';
                ctx.textAlign    = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(beatNum, CX, CY);
            }

            // --- Dots ---
            for (let i = 0; i < 8; i++) {
                const a  = stepAngle(i);
                const x  = CX + Math.cos(a) * RADIUS;
                const y  = CY + Math.sin(a) * RADIUS;
                const active = isPlaying && displayStep === i;
                const r  = active ? DOT_R_A : DOT_R;
                const col = stepColor(i, active || !isPlaying);

                // Glow
                if (active) {
                    const grad = ctx.createRadialGradient(x, y, r * 0.5, x, y, r + 14);
                    grad.addColorStop(0, stepColor(i, true));
                    grad.addColorStop(1, 'transparent');
                    ctx.beginPath();
                    ctx.arc(x, y, r + 14, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();
                }

                // Dot body
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = col;
                ctx.fill();

                // Label
                ctx.fillStyle    = active ? '#fff' : 'rgba(255,255,255,0.45)';
                ctx.font         = active ? 'bold 15px Segoe UI, Arial' : '13px Segoe UI, Arial';
                ctx.textAlign    = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(stepLabels[i], x, y);
            }

            requestAnimationFrame(draw);
        }

        // =========================================================
        //  BPM CONTROLS
        // =========================================================
        function setBpm(val) {
            bpm = Math.max(40, Math.min(300, val));
            document.getElementById('bpmDisplay').textContent = bpm;
        }

        document.getElementById('bpmUp').addEventListener('click',   () => setBpm(bpm + 5));
        document.getElementById('bpmDown').addEventListener('click', () => setBpm(bpm - 5));
        document.getElementById('startStop').addEventListener('click', togglePlayback);

        // Hold-to-repeat for BPM buttons
        let holdTimer = null;
        function startHold(delta) {
            holdTimer = setInterval(() => setBpm(bpm + delta), 120);
        }
        function stopHold() {
            clearInterval(holdTimer);
        }
        document.getElementById('bpmUp').addEventListener('mousedown',  () => startHold(5));
        document.getElementById('bpmDown').addEventListener('mousedown', () => startHold(-5));
        document.addEventListener('mouseup', stopHold);

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlayback();
            } else if (e.code === 'ArrowUp') {
                e.preventDefault();
                setBpm(bpm + 1);
            } else if (e.code === 'ArrowDown') {
                e.preventDefault();
                setBpm(bpm - 1);
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                setBpm(bpm + 10);
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                setBpm(bpm - 10);
            }
        });

        // =========================================================
        //  INIT
        // =========================================================
        loadAllSamples();
        requestAnimationFrame(draw);
    </script>
</body>
</html>
