<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titel %}Bewerbungsbot{% endblock %}</title>
  <style>
    :root {
      --grund: #fbfbfa; --karte: #ffffff; --linie: #e3e2df;
      --text: #1d1c1a; --gedaempft: #6a6862; --akzent: #2d5b8a;
      --gut: #2f6b46; --warnung: #8a5a1e; --schlecht: #8a2f2f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --grund: #17181a; --karte: #202225; --linie: #33363b;
        --text: #e9e8e6; --gedaempft: #a2a09b; --akzent: #7fb0e0;
        --gut: #7fc39a; --warnung: #d8a860; --schlecht: #e08e8e;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--grund); color: var(--text);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    a { color: var(--akzent); }
    header { border-bottom: 1px solid var(--linie); background: var(--karte); }
    .huelle { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
    header .huelle { display: flex; align-items: center; gap: 16px; padding-block: 14px; flex-wrap: wrap; }
    header h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
    main { padding-block: 24px 60px; }
    .meldung { background: var(--karte); border: 1px solid var(--akzent);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 18px; }
    .hinweis { color: var(--warnung); font-size: 13.5px; }
    .reiter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
    .reiter a { text-decoration: none; padding: 5px 11px; border-radius: 999px;
      border: 1px solid var(--linie); color: var(--gedaempft); font-size: 13.5px; }
    .reiter a.aktiv { background: var(--akzent); border-color: var(--akzent); color: #fff; }
    table { width: 100%; border-collapse: collapse; background: var(--karte);
      border: 1px solid var(--linie); border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--linie);
      vertical-align: top; }
    th { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--gedaempft); font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .punkte { font-variant-numeric: tabular-nums; font-weight: 600; }
    .hoch { color: var(--gut); } .mittel { color: var(--warnung); } .tief { color: var(--gedaempft); }
    .karte { background: var(--karte); border: 1px solid var(--linie);
      border-radius: 10px; padding: 18px; margin-bottom: 18px; }
    .knopf { display: inline-block; border: 1px solid var(--linie); background: var(--karte);
      color: var(--text); border-radius: 7px; padding: 7px 14px; font-size: 14px;
      cursor: pointer; text-decoration: none; }
    .knopf:hover { border-color: var(--akzent); }
    .knopf.wichtig { background: var(--akzent); border-color: var(--akzent); color: #fff; }
    textarea, input[type=text] { width: 100%; font: inherit; color: var(--text);
      background: var(--grund); border: 1px solid var(--linie); border-radius: 7px; padding: 9px; }
    textarea { min-height: 320px; resize: vertical; line-height: 1.6; }
    label { display: block; font-size: 13px; color: var(--gedaempft); margin: 12px 0 4px; }
    .gedaempft { color: var(--gedaempft); }
    .inserat { max-height: 420px; overflow-y: auto; white-space: pre-wrap;
      font-size: 14px; border-top: 1px solid var(--linie); padding-top: 12px; }
    .reihe { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
<header>
  <div class="huelle">
    <h1><a href="/" style="text-decoration:none;color:inherit">Bewerbungsbot</a></h1>
    <span class="gedaempft">{{ profil.voller_name }}</span>
    {% if trockenlauf %}<span class="hinweis">Probelauf aktiv - es wird nichts wirklich versendet</span>{% endif %}
    <span style="flex:1"></span>
    <form method="post" action="/lauf">
      <button class="knopf" {% if laeuft %}disabled{% endif %}>
        {% if laeuft %}Suche laeuft ...{% else %}Neue Suche starten{% endif %}
      </button>
    </form>
  </div>
</header>
<main class="huelle">
  {% if meldung %}<div class="meldung">{{ meldung }}</div>{% endif %}
  {% block inhalt %}{% endblock %}
</main>
</body>
</html>
